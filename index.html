<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Groceries">
<meta name="description" content="Grocery inventory with par levels and a below-par shopping list.">
<title>Groceries</title>
<style>
  :root {
    --bg: #f4f7f6;
    --card: #ffffff;
    --text: #102a2a;
    --muted: #5b6e6e;
    --teal: #0f766e;
    --teal-dark: #0b5a54;
    --order: #c2410c;
    --order-bg: #fff7ed;
    --border: #d7e3e1;
    --shadow: 0 1px 3px rgba(16,42,42,.08);
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  body { padding: 12px 12px calc(28px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; }
  header {
    position: sticky; top: 0; z-index: 10;
    background: linear-gradient(180deg, #f4f7f6 70%, rgba(244,247,246,0));
    padding: 8px 0 14px;
  }
  .stamp { color: var(--muted); font-size: .8rem; margin: 0 0 6px; }
  h1 { font-size: 1.35rem; margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); font-size: .92rem; margin: 0 0 12px; }
  .toolbar { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .toolbar-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  button {
    appearance: none; border: none; border-radius: 12px;
    font-size: .95rem; font-weight: 600; padding: 12px 10px;
    min-height: 48px; cursor: pointer;
  }
  .btn-primary { background: var(--teal); color: #fff; }
  .btn-primary:active { background: var(--teal-dark); }
  .btn-secondary { background: #e7f1ef; color: var(--teal-dark); }
  .btn-danger { background: #fee2e2; color: #991b1b; }
  .toast {
    display: none; margin-top: 10px; padding: 10px 12px; border-radius: 10px;
    background: #ecfdf5; color: #065f46; font-size: .95rem; font-weight: 600;
  }
  .toast.show { display: block; }
  .toast.error { background: #fef2f2; color: #991b1b; }
  h2.cat {
    font-size: .85rem; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); margin: 18px 0 8px; font-weight: 700;
  }
  h2.cat:first-child { margin-top: 4px; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .row {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 12px 12px 10px;
  }
  .row.order { border-color: #fdba74; background: var(--order-bg); }
  .row-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .name { font-size: 1.05rem; font-weight: 700; line-height: 1.25; }
  .meta { color: var(--muted); font-size: .88rem; margin-top: 3px; }
  .meta button.link {
    background: none; border: none; color: var(--teal); font-weight: 700;
    font-size: .88rem; padding: 0; min-height: 0; text-decoration: underline;
  }
  .flag {
    flex: 0 0 auto; font-size: .82rem; font-weight: 800; color: var(--order);
    background: #ffedd5; border-radius: 999px; padding: 6px 10px; white-space: nowrap;
    min-height: 32px; display: none; align-items: center;
  }
  .row.order .flag { display: inline-flex; }
  .controls {
    display: grid; grid-template-columns: 56px 1fr 56px; gap: 8px; margin-top: 12px; align-items: center;
  }
  .step {
    background: var(--teal); color: #fff; font-size: 1.6rem; font-weight: 700;
    border-radius: 12px; min-height: 52px; line-height: 1;
  }
  .step:active { background: var(--teal-dark); }
  input[type="number"], input[type="text"] {
    width: 100%; min-height: 48px; border: 2px solid var(--border); border-radius: 12px;
    font-size: 1.1rem; font-weight: 600; color: var(--text); background: #fff; padding: 0 12px;
  }
  input[type="number"] {
    min-height: 52px; font-size: 1.35rem; font-weight: 700; text-align: center; padding: 0;
    -moz-appearance: textfield;
  }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input:focus { outline: none; border-color: var(--teal); }
  .row-actions { display: flex; gap: 8px; margin-top: 8px; }
  .row-actions button { flex: 1; min-height: 40px; font-size: .85rem; background: #f1f5f4; color: var(--muted); }
  .add-card {
    margin-top: 20px; background: var(--card); border: 1px dashed var(--border);
    border-radius: var(--radius); padding: 14px;
  }
  .add-card h3 { margin: 0 0 10px; font-size: 1rem; }
  .add-grid { display: grid; gap: 8px; }
  .add-grid label { font-size: .85rem; color: var(--muted); font-weight: 600; display: grid; gap: 4px; }
  dialog {
    border: none; border-radius: 16px; padding: 0; max-width: 92vw; width: 420px;
    box-shadow: 0 20px 50px rgba(0,0,0,.25);
  }
  dialog::backdrop { background: rgba(16,42,42,.45); }
  .dialog-body { padding: 18px 16px 16px; }
  .dialog-body h2 { margin: 0 0 8px; font-size: 1.15rem; }
  .shop-list { list-style: none; padding: 0; margin: 12px 0; }
  .shop-list li {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 10px 0; border-bottom: 1px solid var(--border); font-weight: 600;
  }
  .shop-list li span.qty { color: var(--teal); white-space: nowrap; }
  .dialog-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .empty { color: var(--muted); font-size: .95rem; padding: 8px 0; }
  footer { margin-top: 18px; color: var(--muted); font-size: .8rem; text-align: center; }
</style>
</head>
<body>
  <header>
    <p class="stamp" id="build-stamp">Updated Oct 28, 2026 · par tracker</p>
    <h1>Groceries</h1>
    <p class="sub">Set on-hand counts. Targets are your par. Shopping list is what’s short.</p>
    <div class="toolbar">
      <button type="button" class="btn-primary" id="shopBtn">Make shopping list</button>
      <button type="button" class="btn-secondary" id="shareBtn">Share</button>
      <button type="button" class="btn-secondary" id="copyBtn">Copy</button>
    </div>
    <div class="toolbar-2">
      <button type="button" class="btn-secondary" id="addToggleBtn">Add item</button>
      <button type="button" class="btn-danger" id="clearBtn">Clear on-hand</button>
    </div>
    <div class="toast" id="toast" role="status"></div>
  </header>

  <main id="list" class="list" aria-live="polite"></main>

  <section class="add-card" id="addCard" hidden>
    <h3>Add item</h3>
    <form id="addForm" class="add-grid">
      <label>Name<input id="addName" type="text" maxlength="60" required autocomplete="off"></label>
      <label>Category<input id="addCategory" type="text" maxlength="40" list="catList" required autocomplete="off"></label>
      <datalist id="catList"></datalist>
      <label>Unit<input id="addUnit" type="text" maxlength="30" placeholder="bottle, bag, each" autocomplete="off"></label>
      <label>Target (par)<input id="addTarget" type="number" min="0" step="1" value="1" required></label>
      <button type="submit" class="btn-primary">Save item</button>
    </form>
  </section>

  <dialog id="shopDialog" aria-labelledby="shopTitle">
    <div class="dialog-body">
      <h2 id="shopTitle">Shopping list</h2>
      <p class="sub" id="shopSub" style="margin:0">Items below par</p>
      <ul class="shop-list" id="shopList"></ul>
      <p class="empty" id="shopEmpty" hidden>Everything is at or above par.</p>
      <div class="dialog-actions">
        <button type="button" class="btn-secondary" id="shopClose">Close</button>
        <button type="button" class="btn-primary" id="shopShare">Share list</button>
      </div>
    </div>
  </dialog>

  <dialog id="editDialog" aria-labelledby="editTitle">
    <form method="dialog" class="dialog-body" id="editForm">
      <h2 id="editTitle">Edit item</h2>
      <div class="add-grid">
        <label>Name<input id="editName" type="text" maxlength="60" required></label>
        <label>Category<input id="editCategory" type="text" maxlength="40" required></label>
        <label>Unit<input id="editUnit" type="text" maxlength="30"></label>
        <label>Target (par)<input id="editTarget" type="number" min="0" step="1" required></label>
      </div>
      <div class="dialog-actions">
        <button type="submit" value="cancel" class="btn-secondary">Cancel</button>
        <button type="submit" value="save" class="btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <footer>On-hand and your target edits stay on this phone only.</footer>

<script>
const SEED = [
  {
    "name": "shampoo",
    "category": "Personal care / bath",
    "unit": "bottle",
    "target": 1
  },
  {
    "name": "conditioner",
    "category": "Personal care / bath",
    "unit": "bottle",
    "target": 1
  },
  {
    "name": "body wash",
    "category": "Personal care / bath",
    "unit": "bottle",
    "target": 1
  },
  {
    "name": "loofah",
    "category": "Personal care / bath",
    "unit": "each",
    "target": 1
  },
  {
    "name": "dog food",
    "category": "Pet",
    "unit": "bag",
    "target": 1
  },
  {
    "name": "white vinegar",
    "category": "Household",
    "unit": "bottle",
    "target": 1
  },
  {
    "name": "Halloween tights",
    "category": "Seasonal / holiday",
    "unit": "pair",
    "target": 1
  }
];

const STORAGE_KEY = "janna-groceries-par-v1";

function uid() {
  if (window.crypto && typeof crypto.randomUUID === "function") return crypto.randomUUID();
  return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== "object") return null;
    if (!Array.isArray(parsed.items)) return null;
    return parsed;
  } catch {
    return null;
  }
}

function seedState() {
  return {
    items: SEED.map((item) => ({
      id: uid(),
      name: item.name,
      category: item.category,
      unit: item.unit || "",
      target: Number(item.target) || 0,
      onHand: null,
    })),
  };
}

function mergeSeed(state) {
  const have = new Set(state.items.map((i) => i.name.toLowerCase()));
  for (const item of SEED) {
    if (have.has(item.name.toLowerCase())) continue;
    state.items.push({
      id: uid(),
      name: item.name,
      category: item.category,
      unit: item.unit || "",
      target: Number(item.target) || 0,
      onHand: null,
    });
  }
  return state;
}

let state = mergeSeed(loadState() || seedState());
saveState();

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

const listEl = document.querySelector("#list");
const toastEl = document.querySelector("#toast");
const addCard = document.querySelector("#addCard");
const shopDialog = document.querySelector("#shopDialog");
const editDialog = document.querySelector("#editDialog");
let editingId = null;

function showToast(msg, isError) {
  toastEl.textContent = msg;
  toastEl.classList.toggle("error", Boolean(isError));
  toastEl.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toastEl.classList.remove("show"), 2200);
}

function shortfall(item) {
  if (item.onHand === null || item.onHand === undefined || item.onHand === "") return null;
  const n = Number(item.onHand);
  const t = Number(item.target);
  if (!Number.isFinite(n) || !Number.isFinite(t)) return null;
  const diff = t - n;
  return diff > 0 ? diff : 0;
}

function isBelow(item) {
  const s = shortfall(item);
  return s !== null && s > 0;
}

function categories() {
  const order = [];
  const map = new Map();
  for (const item of state.items) {
    if (!map.has(item.category)) {
      map.set(item.category, []);
      order.push(item.category);
    }
    map.get(item.category).push(item);
  }
  return order.map((category) => ({ category, items: map.get(category) }));
}

function updateCatList() {
  const dl = document.querySelector("#catList");
  const cats = [...new Set(state.items.map((i) => i.category))];
  dl.innerHTML = cats.map((c) => `<option value="${escapeAttr(c)}"></option>`).join("");
}

function escapeAttr(s) {
  return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
}

function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function render() {
  listEl.innerHTML = "";
  updateCatList();
  for (const group of categories()) {
    const h = document.createElement("h2");
    h.className = "cat";
    h.textContent = group.category;
    listEl.appendChild(h);
    for (const item of group.items) {
      listEl.appendChild(rowEl(item));
    }
  }
}

function rowEl(item) {
  const row = document.createElement("article");
  row.className = "row" + (isBelow(item) ? " order" : "");
  row.dataset.id = item.id;
  const unitBit = item.unit ? ` · ${item.unit}` : "";
  const below = shortfall(item);
  row.innerHTML = `
    <div class="row-top">
      <div>
        <div class="name">${escapeHtml(item.name)}</div>
        <div class="meta">Target: <button type="button" class="link edit-target">${escapeHtml(String(item.target))}</button>${escapeHtml(unitBit)}</div>
      </div>
      <div class="flag">${below ? `${below} short` : ""}</div>
    </div>
    <div class="controls">
      <button type="button" class="step minus" aria-label="Decrease">−</button>
      <input type="number" inputmode="numeric" min="0" step="1" aria-label="On hand">
      <button type="button" class="step plus" aria-label="Increase">+</button>
    </div>
    <div class="row-actions">
      <button type="button" class="edit-btn">Edit</button>
      <button type="button" class="remove-btn">Remove</button>
    </div>`;
  const input = row.querySelector('input[type="number"]');
  if (item.onHand !== null && item.onHand !== undefined && item.onHand !== "") {
    input.value = item.onHand;
  }
  const setOnHand = (value) => {
    if (value === "" || value === null) item.onHand = null;
    else {
      const n = Number(value);
      item.onHand = Number.isFinite(n) ? Math.max(0, Math.floor(n)) : null;
    }
    saveState();
    const s = shortfall(item);
    row.classList.toggle("order", s !== null && s > 0);
    row.querySelector(".flag").textContent = s ? `${s} short` : "";
  };
  input.addEventListener("input", () => setOnHand(input.value));
  row.querySelector(".minus").addEventListener("click", () => {
    const cur = item.onHand === null || item.onHand === "" ? 0 : Number(item.onHand);
    const next = Math.max(0, (Number.isFinite(cur) ? cur : 0) - 1);
    input.value = String(next);
    setOnHand(next);
  });
  row.querySelector(".plus").addEventListener("click", () => {
    const cur = item.onHand === null || item.onHand === "" ? 0 : Number(item.onHand);
    const next = (Number.isFinite(cur) ? cur : 0) + 1;
    input.value = String(next);
    setOnHand(next);
  });
  row.querySelector(".edit-target").addEventListener("click", () => openEdit(item));
  row.querySelector(".edit-btn").addEventListener("click", () => openEdit(item));
  row.querySelector(".remove-btn").addEventListener("click", () => {
    if (!confirm(`Remove “${item.name}” from the catalog?`)) return;
    state.items = state.items.filter((i) => i.id !== item.id);
    saveState();
    render();
    showToast(`Removed ${item.name}`);
  });
  return row;
}

function openEdit(item) {
  editingId = item.id;
  document.querySelector("#editName").value = item.name;
  document.querySelector("#editCategory").value = item.category;
  document.querySelector("#editUnit").value = item.unit || "";
  document.querySelector("#editTarget").value = String(item.target);
  editDialog.showModal();
}

document.querySelector("#editForm").addEventListener("submit", (event) => {
  // method=dialog: only handle save
});

editDialog.addEventListener("close", () => {
  if (editDialog.returnValue !== "save") {
    editingId = null;
    return;
  }
  const item = state.items.find((i) => i.id === editingId);
  editingId = null;
  if (!item) return;
  const name = document.querySelector("#editName").value.trim().replace(/\s+/g, " ");
  const category = document.querySelector("#editCategory").value.trim().replace(/\s+/g, " ");
  const unit = document.querySelector("#editUnit").value.trim().replace(/\s+/g, " ");
  const target = Math.max(0, Math.floor(Number(document.querySelector("#editTarget").value) || 0));
  if (!name || !category) {
    showToast("Name and category are required.", true);
    return;
  }
  item.name = name;
  item.category = category;
  item.unit = unit;
  item.target = target;
  saveState();
  render();
  showToast("Saved");
});

function belowItems() {
  return state.items
    .map((item) => ({ item, need: shortfall(item) }))
    .filter((x) => x.need !== null && x.need > 0);
}

function shoppingText() {
  const rows = belowItems();
  if (!rows.length) return "Shopping list: nothing below par.";
  const lines = ["Shopping list (below par):"];
  for (const { item, need } of rows) {
    const unit = item.unit ? ` ${item.unit}` : "";
    lines.push(`- ${item.name}: buy ${need}${unit} (have ${item.onHand}, par ${item.target})`);
  }
  return lines.join("\n");
}

function inventoryText() {
  const lines = ["Grocery inventory:"];
  for (const group of categories()) {
    lines.push(`\n${group.category}`);
    for (const item of group.items) {
      const have = item.onHand === null || item.onHand === "" ? "—" : String(item.onHand);
      const unit = item.unit ? ` ${item.unit}` : "";
      const flag = isBelow(item) ? ` · ${shortfall(item)} short` : "";
      lines.push(`- ${item.name}: ${have}${unit} (par ${item.target})${flag}`);
    }
  }
  const below = belowItems();
  lines.push(
    below.length
      ? `\nBelow par: ${below.map(({ item, need }) => `${item.name} (${need})`).join("; ")}`
      : "\nBelow par: none"
  );
  return lines.join("\n");
}

async function shareOrCopy(text, okMsg) {
  if (navigator.share) {
    try {
      await navigator.share({ title: "Groceries", text });
      showToast(okMsg || "Shared");
      return;
    } catch (err) {
      if (err && err.name === "AbortError") return;
    }
  }
  try {
    await navigator.clipboard.writeText(text);
    showToast("Copied");
  } catch {
    showToast("Couldn’t copy — select and copy manually.", true);
  }
}

function openShop() {
  const rows = belowItems();
  const ul = document.querySelector("#shopList");
  const empty = document.querySelector("#shopEmpty");
  ul.innerHTML = "";
  if (!rows.length) {
    empty.hidden = false;
    document.querySelector("#shopShare").disabled = true;
  } else {
    empty.hidden = true;
    document.querySelector("#shopShare").disabled = false;
    for (const { item, need } of rows) {
      const li = document.createElement("li");
      const unit = item.unit ? ` ${item.unit}` : "";
      li.innerHTML = `<span>${escapeHtml(item.name)}</span><span class="qty">buy ${need}${escapeHtml(unit)}</span>`;
      ul.appendChild(li);
    }
  }
  shopDialog.showModal();
}

document.querySelector("#shopBtn").addEventListener("click", openShop);
document.querySelector("#shopClose").addEventListener("click", () => shopDialog.close());
document.querySelector("#shopShare").addEventListener("click", () => shareOrCopy(shoppingText(), "Shared list"));
document.querySelector("#shareBtn").addEventListener("click", () => shareOrCopy(inventoryText(), "Shared"));
document.querySelector("#copyBtn").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(inventoryText());
    showToast("Copied");
  } catch {
    showToast("Couldn’t copy.", true);
  }
});
document.querySelector("#clearBtn").addEventListener("click", () => {
  if (!confirm("Clear all on-hand counts on this phone? Targets stay.")) return;
  for (const item of state.items) item.onHand = null;
  saveState();
  render();
  showToast("On-hand cleared");
});
document.querySelector("#addToggleBtn").addEventListener("click", () => {
  addCard.hidden = !addCard.hidden;
  if (!addCard.hidden) document.querySelector("#addName").focus();
});
document.querySelector("#addForm").addEventListener("submit", (event) => {
  event.preventDefault();
  const name = document.querySelector("#addName").value.trim().replace(/\s+/g, " ");
  const category = document.querySelector("#addCategory").value.trim().replace(/\s+/g, " ");
  const unit = document.querySelector("#addUnit").value.trim().replace(/\s+/g, " ");
  const target = Math.max(0, Math.floor(Number(document.querySelector("#addTarget").value) || 0));
  if (!name || !category) return;
  const dup = state.items.some((i) => i.name.toLowerCase() === name.toLowerCase());
  if (dup) {
    showToast(`${name} is already on the list.`, true);
    return;
  }
  state.items.push({ id: uid(), name, category, unit, target, onHand: null });
  saveState();
  document.querySelector("#addForm").reset();
  document.querySelector("#addTarget").value = "1";
  addCard.hidden = true;
  render();
  showToast(`Added ${name}`);
});

render();
</script>
</body>
</html>
