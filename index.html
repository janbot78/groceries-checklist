<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Janna Smith's grocery checklist. Check items off in the browser; the list stays on this device.">
  <meta name="theme-color" content="#f4efe6">
  <title>Groceries · Janna Smith</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f4efe6'/%3E%3Cpath d='M8 16.5 13 21.5 24 10' fill='none' stroke='%236e4b38' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
:root {
  color-scheme: light;
  --paper: #f4efe6;
  --sheet: #fbf7f0;
  --ink: #2c241e;
  --muted: #5c4e44;
  --line: #e6d9c8;
  --clay: #6e4b38;
  --clay-deep: #5c3f2f;
  --olive: #3f5340;
  --danger: #8a3d32;
  --field: #fffdf9;
  --shadow: 0 18px 50px rgba(60, 40, 20, 0.08);
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  height: 100%;
}

body {
  margin: 0;
  min-height: 100%;
  background: var(--paper);
  color: var(--ink);
  font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
  font-size: 1.0625rem;
  line-height: 1.45;
}

button,
input,
.who,
.summary,
.save-note,
.hint,
.form-message,
.footnote,
.category h2,
.actions,
.add h2,
.noscript {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}

.sheet {
  width: min(100%, 34rem);
  margin: 0 auto;
  padding:
    calc(1.4rem + env(safe-area-inset-top))
    calc(1.15rem + env(safe-area-inset-right))
    calc(2.5rem + env(safe-area-inset-bottom))
    calc(1.15rem + env(safe-area-inset-left));
}

.who {
  margin: 0;
  color: var(--clay);
  font-size: 0.82rem;
  font-weight: 650;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

h1 {
  margin: 0.2rem 0 0.35rem;
  font-size: 2.15rem;
  font-weight: 560;
  letter-spacing: -0.03em;
  line-height: 1.1;
}

.summary {
  margin: 0;
  color: var(--muted);
  font-size: 1rem;
}

.save-note {
  margin: 0.55rem 0 0;
  color: var(--danger);
  font-size: 0.92rem;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-top: 1.25rem;
}

.list {
  margin-top: 0.4rem;
}

.category {
  margin-top: 1.45rem;
}

.category h2,
.add h2 {
  margin: 0 0 0.35rem;
  color: var(--clay);
  font-size: 0.95rem;
  font-weight: 680;
  letter-spacing: 0.01em;
}

.category ul {
  list-style: none;
  margin: 0;
  padding: 0;
  border-top: 1px solid var(--line);
}

.item {
  display: flex;
  align-items: flex-start;
  gap: 0.85rem;
  min-height: 48px;
  padding: 0.72rem 0.1rem;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
}

.item input {
  width: 1.35rem;
  height: 1.35rem;
  margin: 0.12rem 0 0;
  flex: 0 0 auto;
  accent-color: var(--clay);
}

.item-name {
  font-size: 1.15rem;
  overflow-wrap: anywhere;
}

.item.is-checked .item-name {
  color: var(--muted);
  text-decoration: line-through;
  text-decoration-thickness: 2px;
  text-decoration-color: #8a6a58;
  text-decoration-skip-ink: none;
}

.empty {
  margin: 1.25rem 0 0;
  color: var(--muted);
}

.add {
  margin-top: 1.8rem;
  padding-top: 1.35rem;
  border-top: 1px solid var(--line);
}

.hint,
.footnote,
.noscript {
  margin: 0.2rem 0 0.9rem;
  color: var(--muted);
  font-size: 0.92rem;
}

.footnote {
  margin-top: 1.4rem;
  margin-bottom: 0;
}

label {
  display: block;
  margin: 0.75rem 0 0.3rem;
  color: var(--muted);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 0.85rem;
  font-weight: 650;
}

input[type="text"] {
  display: block;
  width: 100%;
  min-height: 48px;
  padding: 0.7rem 0.8rem;
  border: 1px solid #d9cbb8;
  border-radius: 10px;
  background: var(--field);
  color: var(--ink);
  font: 1rem/1.3 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}

input[type="text"]:focus {
  border-color: var(--clay);
  outline: 2px solid transparent;
}

input[aria-invalid="true"] {
  border-color: var(--danger);
}

.form-message {
  min-height: 1.2rem;
  margin: 0.55rem 0 0.7rem;
  color: var(--olive);
  font-size: 0.92rem;
}

.form-message.is-error {
  color: var(--danger);
}

button,
.item {
  touch-action: manipulation;
}

button {
  min-height: 44px;
  padding: 0.6rem 0.95rem;
  border-radius: 10px;
  border: 1px solid transparent;
  font: 650 0.95rem/1 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.42;
}

.primary {
  width: 100%;
  background: var(--clay);
  color: #fbf7f0;
}

.primary:hover:not(:disabled) {
  background: var(--clay-deep);
}

.secondary {
  background: transparent;
  border-color: #d3c4b2;
  color: var(--ink);
}

.actions .secondary {
  flex: 1 1 9rem;
}

.secondary:hover:not(:disabled) {
  background: #efe6d8;
}

.danger {
  background: var(--danger);
  color: #fffaf7;
}

.danger:hover:not(:disabled) {
  background: #732f27;
}

button:focus-visible,
input:focus-visible {
  outline: 2px solid var(--clay);
  outline-offset: 2px;
}

dialog {
  width: min(22rem, calc(100% - 2rem));
  padding: 1.2rem 1.15rem 1.1rem;
  border: none;
  border-radius: 14px;
  background: var(--sheet);
  color: var(--ink);
  box-shadow: var(--shadow);
}

dialog::backdrop {
  background: rgba(44, 36, 30, 0.4);
}

dialog p {
  margin: 0 0 1rem;
  font-size: 1.08rem;
}

.dialog-actions {
  display: flex;
  justify-content: flex-end;
  gap: 0.5rem;
}

.noscript {
  margin-top: 1rem;
  padding: 0.8rem 0.9rem;
  background: #f3e2c8;
  border-radius: 10px;
  color: var(--ink);
}

@media (min-width: 700px) {
  body {
    background:
      linear-gradient(180deg, #efe6d8 0%, #e7dccb 100%);
  }

  .sheet {
    min-height: auto;
    margin: 2.25rem auto;
    padding: 2rem 1.8rem 2.2rem;
    background: var(--sheet);
    border-radius: 16px;
    box-shadow: var(--shadow);
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    transition: none !important;
  }
}

@media print {
  body {
    background: white;
  }

  .sheet {
    width: auto;
    margin: 0;
    box-shadow: none;
  }

  .actions,
  .add,
  .footnote,
  .noscript,
  .save-note {
    display: none;
  }

  .item.is-checked .item-name {
    text-decoration: line-through;
  }
}

</style>
</head>
<body>
  <main class="sheet">
    <header class="masthead">
      <p class="who">Janna Smith</p>
      <h1>Groceries</h1>
      <p id="summary" class="summary" aria-live="polite"></p>
      <p id="save-note" class="save-note" hidden></p>
    </header>

    <div id="list" class="list"><section class="category"><h2>Personal care / bath</h2><ul><li><label class="item"><input type="checkbox"><span class="item-name">shampoo</span></label></li><li><label class="item"><input type="checkbox"><span class="item-name">conditioner</span></label></li><li><label class="item"><input type="checkbox"><span class="item-name">body wash</span></label></li><li><label class="item"><input type="checkbox"><span class="item-name">loofah</span></label></li></ul></section><section class="category"><h2>Pet</h2><ul><li><label class="item"><input type="checkbox"><span class="item-name">dog food</span></label></li></ul></section><section class="category"><h2>Seasonal / holiday</h2><ul><li><label class="item"><input type="checkbox"><span class="item-name">Halloween tights</span></label></li></ul></section></div>

    <div class="actions">
      <button type="button" id="uncheck-all" class="secondary">Uncheck all</button>
      <button type="button" id="remove-checked" class="secondary">Remove checked</button>
    </div>

    <form id="add-form" class="add" novalidate>
      <h2>Add an item</h2>
      <p class="hint">Use a category already on the list, or type a new one.</p>
      <label for="item-name">Item</label>
      <input id="item-name" name="name" type="text" maxlength="80" autocomplete="off" enterkeyhint="next" placeholder="paper towels" required>
      <label for="item-category">Category</label>
      <input id="item-category" name="category" type="text" maxlength="40" list="categories" autocomplete="off" enterkeyhint="done" placeholder="Household" aria-describedby="form-message" required>
      <datalist id="categories"></datalist>
      <p id="form-message" class="form-message" role="status"></p>
      <button type="submit" class="primary">Add to list</button>
    </form>

    <p class="footnote">Saved in this browser on this device. Another phone, or a private window, starts from the original list.</p>

    <noscript>
      <p class="noscript">This checklist needs JavaScript so it can remember what you check. Enable JavaScript and reload the page.</p>
    </noscript>
  </main>

  <dialog id="confirm-dialog" aria-labelledby="confirm-text">
    <form method="dialog">
      <p id="confirm-text"></p>
      <div class="dialog-actions">
        <button type="submit" value="cancel" class="secondary">Keep them</button>
        <button type="submit" value="remove" class="danger">Remove</button>
      </div>
    </form>
  </dialog>

  <script>
const STORAGE_KEY = "janna-groceries-v1";

const SEED = [
  { name: "shampoo", category: "Personal care / bath" },
  { name: "conditioner", category: "Personal care / bath" },
  { name: "body wash", category: "Personal care / bath" },
  { name: "loofah", category: "Personal care / bath" },
  { name: "dog food", category: "Pet" },
  { name: "Halloween tights", category: "Seasonal / holiday" },
];

const summaryEl = document.querySelector("#summary");
const saveNoteEl = document.querySelector("#save-note");
const listEl = document.querySelector("#list");
const formEl = document.querySelector("#add-form");
const nameInput = document.querySelector("#item-name");
const categoryInput = document.querySelector("#item-category");
const categoriesEl = document.querySelector("#categories");
const formMessageEl = document.querySelector("#form-message");
const uncheckAllBtn = document.querySelector("#uncheck-all");
const removeCheckedBtn = document.querySelector("#remove-checked");
const confirmDialog = document.querySelector("#confirm-dialog");
const confirmText = document.querySelector("#confirm-text");

let items = loadItems();
let saveError = "";

function uid() {
  if (window.crypto && typeof crypto.randomUUID === "function") {
    return crypto.randomUUID();
  }
  return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
}

function seedItems() {
  return SEED.map((item) => ({
    id: uid(),
    name: item.name,
    category: item.category,
    checked: false,
  }));
}

function isItem(value) {
  return Boolean(
    value &&
      typeof value.id === "string" &&
      typeof value.name === "string" &&
      value.name.trim() &&
      typeof value.category === "string" &&
      value.category.trim() &&
      typeof value.checked === "boolean"
  );
}

function loadItems() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw === null) return seedItems();
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed) || parsed.length === 0 || !parsed.every(isItem)) return seedItems();
    return parsed;
  } catch {
    return seedItems();
  }
}

function saveItems() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    saveError = "";
  } catch {
    saveError = "This browser blocked saving, so checks may reset when you leave the page.";
  }
}

function cleanText(value) {
  return value.trim().replace(/\s+/g, " ");
}

function canonicalCategory(name) {
  const match = items.find(
    (item) => item.category.toLowerCase() === name.toLowerCase()
  );
  return match ? match.category : name;
}

function groups() {
  const order = [];
  const byName = new Map();
  for (const item of items) {
    if (!byName.has(item.category)) {
      byName.set(item.category, []);
      order.push(item.category);
    }
    byName.get(item.category).push(item);
  }
  return order.map((category) => ({
    category,
    items: byName.get(category),
  }));
}

function updateChrome() {
  const checked = items.filter((item) => item.checked).length;
  const remaining = items.length - checked;

  if (items.length === 0) {
    summaryEl.textContent = "Nothing on the list.";
  } else if (remaining === 0) {
    summaryEl.textContent = "All set. Everything is checked off.";
  } else if (checked === 0) {
    summaryEl.textContent = `${remaining} to get`;
  } else {
    summaryEl.textContent = `${remaining} to get, ${checked} checked`;
  }

  saveNoteEl.hidden = !saveError;
  saveNoteEl.textContent = saveError;
  uncheckAllBtn.disabled = checked === 0;
  removeCheckedBtn.disabled = checked === 0;

  categoriesEl.replaceChildren();
  const seen = new Set();
  for (const item of items) {
    const key = item.category.toLowerCase();
    if (seen.has(key)) continue;
    seen.add(key);
    const option = document.createElement("option");
    option.value = item.category;
    categoriesEl.append(option);
  }
}

function renderItem(item) {
  const li = document.createElement("li");
  const label = document.createElement("label");
  label.className = item.checked ? "item is-checked" : "item";

  const input = document.createElement("input");
  input.type = "checkbox";
  input.checked = item.checked;
  input.dataset.id = item.id;

  const name = document.createElement("span");
  name.className = "item-name";
  name.textContent = item.name;

  input.addEventListener("change", () => {
    item.checked = input.checked;
    saveItems();
    render(item.id);
  });

  label.append(input, name);
  li.append(label);
  return li;
}

function render(focusId) {
  updateChrome();
  listEl.replaceChildren();

  if (items.length === 0) {
    const empty = document.createElement("p");
    empty.className = "empty";
    empty.textContent = "The list is clear. Add something below when you think of it.";
    listEl.append(empty);
    return;
  }

  for (const group of groups()) {
    const section = document.createElement("section");
    section.className = "category";
    const heading = document.createElement("h2");
    heading.textContent = group.category;
    const ul = document.createElement("ul");
    const ordered = [
      ...group.items.filter((item) => !item.checked),
      ...group.items.filter((item) => item.checked),
    ];
    for (const item of ordered) ul.append(renderItem(item));
    section.append(heading, ul);
    listEl.append(section);
  }

  if (focusId) {
    const field = listEl.querySelector(`[data-id="${focusId}"]`);
    if (field) field.focus({ preventScroll: true });
  }
}

function setFormMessage(message, field) {
  formMessageEl.textContent = message;
  formMessageEl.classList.toggle("is-error", Boolean(field));
  nameInput.removeAttribute("aria-invalid");
  categoryInput.removeAttribute("aria-invalid");
  if (field) {
    field.setAttribute("aria-invalid", "true");
    field.focus();
  }
}

formEl.addEventListener("submit", (event) => {
  event.preventDefault();
  const name = cleanText(nameInput.value);
  const categoryRaw = cleanText(categoryInput.value);

  if (!name) {
    setFormMessage("Enter the item you need.", nameInput);
    return;
  }
  if (!categoryRaw) {
    setFormMessage("Enter a category, such as Pantry or Pet.", categoryInput);
    return;
  }

  const category = canonicalCategory(categoryRaw);
  const duplicate = items.some(
    (item) =>
      item.name.toLowerCase() === name.toLowerCase() &&
      item.category.toLowerCase() === category.toLowerCase()
  );
  if (duplicate) {
    setFormMessage(`${name} is already under ${category}.`, nameInput);
    return;
  }

  items.push({ id: uid(), name, category, checked: false });
  saveItems();
  nameInput.value = "";
  setFormMessage(`Added ${name} under ${category}.`, null);
  render();
  nameInput.focus();
});

function clearFormMessageOnEdit(field) {
  field.addEventListener("input", () => {
    field.removeAttribute("aria-invalid");
    formMessageEl.textContent = "";
    formMessageEl.classList.remove("is-error");
  });
}

clearFormMessageOnEdit(nameInput);
clearFormMessageOnEdit(categoryInput);

uncheckAllBtn.addEventListener("click", () => {
  for (const item of items) item.checked = false;
  saveItems();
  render();
});

removeCheckedBtn.addEventListener("click", () => {
  const checked = items.filter((item) => item.checked);
  if (checked.length === 0) return;
  confirmText.textContent =
    checked.length === 1
      ? `Remove “${checked[0].name}” from the list?`
      : `Remove ${checked.length} checked items from the list?`;
  confirmDialog.showModal();
});

confirmDialog.addEventListener("close", () => {
  if (confirmDialog.returnValue !== "remove") return;
  items = items.filter((item) => !item.checked);
  saveItems();
  render();
});

window.addEventListener("storage", (event) => {
  if (event.key !== STORAGE_KEY) return;
  items = loadItems();
  render();
});

render();

</script>
</body>
</html>
